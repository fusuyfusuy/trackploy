[project]
name = "trackploy"
version = "0.1.0"
description = "Continuous GitHub Actions, Git Pushes, and Dokploy Deployment Tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
trackploy = "trackploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackploy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
